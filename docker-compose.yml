version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: wikicards_mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: dolibarr
      MYSQL_USER: dolibarr
      MYSQL_PASSWORD: dolibarrpassword
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    networks:
      - wikicards_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 3

  dolibarr:
    image: dolibarr/dolibarr:latest
    container_name: wikicards_dolibarr
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DATABASE_HOST: mysql
      DATABASE_USER: dolibarr
      DATABASE_PASSWORD: dolibarrpassword
      DATABASE_NAME: dolibarr
      DOLI_DB_TYPE: mysqli
      PHP_INI_DATE_TIMEZONE: Europe/Paris
      PHP_MEMORY_LIMIT: 256M
      PHP_MAX_EXECUTION_TIME: 300
    volumes:
      - dolibarr_documents:/var/www/html/documents
      - dolibarr_custom:/var/www/html/custom
    ports:
      - "8080:80"
    networks:
      - wikicards_network
    restart: unless-stopped

volumes:
  mysql_data:
  dolibarr_documents:
  dolibarr_custom:

networks:
  wikicards_network: