version: '3.8'

services:
  db:
    image: mariadb:10.11
    environment:
      MYSQL_ROOT_PASSWORD: dolibarr
      MYSQL_DATABASE: dolibarr
      MYSQL_USER: dolibarr
      MYSQL_PASSWORD: dolibarr
    volumes:
      - db_data:/var/lib/mysql
    restart: always
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

  dolibarr:
    image: dolibarr/dolibarr:latest
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:80"
    environment:
      DATABASE_HOST: db
      DATABASE_USER: dolibarr
      DATABASE_PASSWORD: dolibarr
      DATABASE_NAME: dolibarr
      DOLI_DB_TYPE: mysqli
      DOLI_INSTALL_AUTO: 1
      DOLI_ADMIN_LOGIN: admin
      DOLI_ADMIN_PASSWORD: admin123
      DOLI_ADMIN_MAIL: admin@wikicards.local
      PHP_INI_DATE_TIMEZONE: Europe/Paris
    volumes:
      - dolibarr_data:/var/www/html/documents
      - dolibarr_conf:/var/www/html/conf
    restart: always
    # Désactiver l'installation auto si problème
    command: >
      bash -c "
        # Attendre que la BDD soit vraiment prête
        while ! mysql -h db -u dolibarr -pdolibarr dolibarr -e 'SELECT 1' &> /dev/null; do
          echo 'En attente de la base de données...';
          sleep 5;
        done;
        # Démarrer Apache seulement quand la BDD est prête
        exec apache2-foreground
      "

volumes:
  db_data:
  dolibarr_data:
  dolibarr_conf: