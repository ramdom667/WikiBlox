services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: dolibarr
      MYSQL_DATABASE: dolibarr
      MYSQL_USER: dolibarr
      MYSQL_PASSWORD: dolibarr
    command: --default-authentication-plugin=mysql_native_password
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  dolibarr:
    image: dolibarr/dolibarr:latest
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:80"
    environment:
      DATABASE_HOST: db
      DATABASE_USER: dolibarr
      DATABASE_PASSWORD: dolibarr
      DATABASE_NAME: dolibarr
      DOLI_DB_TYPE: mysqli
      DOLI_INSTALL_AUTO: 1
      DOLI_ADMIN_LOGIN: admin
      DOLI_ADMIN_PASSWORD: admin123
      DOLI_ADMIN_MAIL: admin@wikicards.local
      PHP_INI_DATE_TIMEZONE: Europe/Paris
      PHP_MEMORY_LIMIT: 256M
    restart: unless-stopped
    volumes:
      - dolibarr_data:/var/www/html/documents
      - dolibarr_conf:/var/www/html/conf
      - dolibarr_custom:/var/www/html/custom

volumes:
  dolibarr_data:
  dolibarr_conf:
  dolibarr_custom: