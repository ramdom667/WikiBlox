services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: dolibarr
      MYSQL_DATABASE: dolibarr
      MYSQL_USER: dolibarr
      MYSQL_PASSWORD: dolibarr
    command: --default-authentication-plugin=mysql_native_password
    restart: always

  dolibarr:
    image: dolibarr/dolibarr:linux
    depends_on:
      - db
    ports:
      - "8080:80"
    environment:
      DATABASE_HOST: db
      DATABASE_USER: dolibarr
      DATABASE_PASSWORD: dolibarr
      DATABASE_NAME: dolibarr
      DOLI_DB_TYPE: mysqli
      DOLI_INSTALL_AUTO: 1
      DOLI_ADMIN_LOGIN: admin
      DOLI_ADMIN_PASSWORD: admin123
      DOLI_ADMIN_MAIL: admin@wikicards.local
      PHP_INI_DATE_TIMEZONE: Europe/Paris
    restart: always