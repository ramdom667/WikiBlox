version: '3'

services:
  db:
    image: mysql:5.7
    environment:
      MYSQL_ROOT_PASSWORD: dolibarr
      MYSQL_DATABASE: dolibarr
      MYSQL_USER: dolibarr
      MYSQL_PASSWORD: dolibarr
    volumes:
      - db_data:/var/lib/mysql
    restart: always

  dolibarr:
    image: tuxgasy/dolibarr:latest
    depends_on:
      - db
    ports:
      - "8080:80"
    environment:
      DOLI_DB_HOST: db
      DOLI_DB_NAME: dolibarr
      DOLI_DB_USER: dolibarr
      DOLI_DB_PASSWORD: dolibarr
      DOLI_DB_TYPE: mysqli
      DOLI_ADMIN_LOGIN: admin
      DOLI_ADMIN_PASSWORD: admin123
      DOLI_URL_ROOT: "http://localhost:8080"
    volumes:
      - dolibarr_data:/var/www/html/documents
      - dolibarr_extra:/var/www/html/custom
    restart: always

volumes:
  db_data:
  dolibarr_data:
  dolibarr_extra: