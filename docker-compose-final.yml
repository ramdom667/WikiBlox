services:
  mysql:
    image: mysql:8.0
    container_name: wikicards_mysql
    environment:
      MYSQL_ROOT_PASSWORD: dolibarr
      MYSQL_DATABASE: dolibarr
      MYSQL_USER: dolibarr
      MYSQL_PASSWORD: dolibarr
    ports:
      - "3306:3306"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pdolibarr"]
      interval: 10s
      timeout: 5s
      retries: 10

  dolibarr:
    image: dolibarr/dolibarr:latest
    container_name: wikicards_dolibarr
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DATABASE_HOST: mysql
      DATABASE_USER: dolibarr
      DATABASE_PASSWORD: dolibarr
      DATABASE_NAME: dolibarr
      DOLI_DB_TYPE: mysqli
      DOLI_INSTALL_AUTO: 1
      DOLI_ADMIN_LOGIN: admin
      DOLI_ADMIN_PASSWORD: admin123
      DOLI_ADMIN_MAIL: admin@wikicards.local
      PHP_INI_DATE_TIMEZONE: Europe/Paris
    ports:
      - "8080:80"
    restart: unless-stopped