version: '3.8'

services:
  mariadb:
    image: mariadb:10.11
    container_name: dolibarr_mariadb
    environment:
      MYSQL_ROOT_PASSWORD: dolibarr
      MYSQL_DATABASE: dolibarr
      MYSQL_USER: dolibarr
      MYSQL_PASSWORD: dolibarr
      MYSQL_INITDB_SKIP_TZINFO: 1
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 3

  dolibarr:
    image: dolibarr/dolibarr:latest
    container_name: dolibarr_app
    depends_on:
      mariadb:
        condition: service_healthy
    ports:
      - "8080:80"
    environment:
      DATABASE_HOST: mariadb
      DATABASE_PORT: 3306
      DATABASE_USER: dolibarr
      DATABASE_PASSWORD: dolibarr
      DATABASE_NAME: dolibarr
      DOLI_DB_TYPE: mysqli
      DOLI_URL_ROOT: "http://localhost:8080"
      PHP_INI_DATE_TIMEZONE: Europe/Paris
      PHP_MEMORY_LIMIT: 256M
    volumes:
      - dolibarr_data:/var/www/html/documents
      - dolibarr_conf:/var/www/html/conf
      - dolibarr_htdocs:/var/www/html/htdocs
    restart: unless-stopped
    stdin_open: true
    tty: true

volumes:
  mariadb_data:
  dolibarr_data:
  dolibarr_conf:
  dolibarr_htdocs: